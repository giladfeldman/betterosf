# Scaffolded by post-deploy-verify skill (anonymous-only profile for BetterOSF).
#
# Runs anonymous Tier-1 probes against every successful Production Vercel
# deployment — even ones that bypass /ship. Opens a GitHub issue on failure.
# No TEST_AUTH_SECRET: BetterOSF has no DB / role-gated pages and uses OSF OAuth,
# so there are no authenticated probes to run.
name: post-deploy-verify
on:
  deployment_status:

jobs:
  verify:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run anonymous post-deploy probes
        env:
          BASE_URL: ${{ github.event.deployment_status.target_url }}
        run: >-
          npx playwright test
          --config tests/post-deploy/playwright.config.ts
          tests/post-deploy/anon-probes.spec.ts

      - name: Upload probe report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-report
          path: |
            post-deploy-report.json
            test-results/

      - name: Open incident issue on failure
        if: failure()
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ github.event.deployment_status.target_url }}
          SHA: ${{ github.sha }}
        with:
          script: |
            const sha = process.env.SHA.slice(0, 7);
            const title = `🚨 post-deploy-verify failed for ${sha}`;
            const body = [
              `**Deployment URL:** ${process.env.DEPLOY_URL}`,
              ``,
              `Anonymous probes failed. See the Actions run for details:`,
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `Short-term action: consider rolling back via the Vercel dashboard.`,
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["incident", "post-deploy"],
            });
